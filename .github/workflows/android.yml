name: Build & Release Android TV App

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'update.json'
      - 'README.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Extract App Version Details
        id: get_version
        run: |
          # Extraer versionCode y versionName de app/build.gradle.kts
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | tr -d ' ' | cut -d'=' -f2)
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Version Code: $VERSION_CODE, Version Name: $VERSION_NAME"

      - name: Generate update.json
        run: |
          cat <<EOF > update.json
          {
            "versionCode": ${{ steps.get_version.outputs.version_code }},
            "versionName": "${{ steps.get_version.outputs.version_name }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/FibraconetIPTV_television.apk",
            "releaseNotes": "Actualización automática de Fibraconet IPTV para Smart TV (Auto-build v${{ steps.get_version.outputs.version_name }})."
          }
          EOF

      - name: Commit & Push update.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Auto-update update.json to v${{ steps.get_version.outputs.version_name }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: Rename APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FibraconetIPTV_television.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version_name }}-${{ steps.get_version.outputs.version_code }}
          name: Release v${{ steps.get_version.outputs.version_name }}
          body: |
            ## Fibraconet IPTV (Optimizado para TV)
            
            Esta versión ha sido compilada automáticamente mediante GitHub Actions.
            
            ### Notas de Versión:
            - Soporte para D-pad, audio estéreo compatible y corrección de congelamientos.
            - Versión de código: ${{ steps.get_version.outputs.version_code }}
          files: FibraconetIPTV_television.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
